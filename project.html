<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/14.0.2/nouislider.min.css"
    />

    <style type="text/css">
      div.tooltip {
        position: absolute;
        text-align: center;
        width: 100px;
        height: 60px;
        padding: 2px;
        font: 12px sans-serif;
        background: #fff;
        border: 0px;
        pointer-events: none;
      }

      /* ===== CHANGE: Added year-label styling (NEW FEATURE) =====
         Original code did not have year label display. This shows
         the currently selected year on the map visualization */
      .year-label {
        position: absolute;
        top: 60px; /* MODIFIED: Moved down */
        right: 150px;
        font-size: 18px;
        font-weight: bold;
        color: #333;
        background-color: #ffe0b2;
        padding: 5px 10px;
        border: 2px solid coral;
        border-radius: 5px;
        box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
        z-index: 10;
      }

      .states:hover {
        fill-opacity: 0.5;
      }

      .county:hover {
        fill-opacity: 0.5;
      }

      .state-borders {
        stroke: #fff;
        stroke-width: 0.5px;
        stroke-linejoin: round;
        stroke-linecap: round;
        pointer-events: none;
      }

      .highlight {
        fill: #d3d3d3 !important;
      }
      .highlight2 {
        color: white !important;
      }
      .highlight3 {
        color: red !important;
      }
      .highlightState {
        stroke: purple !important;
        stroke-width: 4px !important;
      }
      .highlight_text {
        font-size: x-large !important;
        color: #008cba !important;
      }
      table,
      th,
      td {
        border: 1px solid black;
      }

      /* ===== CHANGE: Restructured layout from row-based to column-based =====
         Original: #linked-advanced had flex-direction: row (horizontal layout)
         Updated: Changed to column-based layout with new containers:
         - #map-and-controls: Contains year slider and map visualization
         - #map-visualization: Contains US map and right panel side-by-side
         This enables better organization with year slider at top */
      /* --- GLOBAL LAYOUT FIXES --- */
      #linked-advanced {
        display: flex;
        flex-direction: column;
        align-items: flex-start; /* Aligns content to the left */
        padding-top: 20px;
      }
      #map-and-controls {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: 800px;
        margin-left: 10px; /* Padding from left edge */
      }
      #map-visualization {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        width: 100%;
      }
      #linked-advanced .map-container .us-map {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        position: relative;
      }

      /* ===== CHANGE: Added year slider container styling (NEW FEATURE) =====
         Original code did not have year slider. This container holds the
         year slider and play/pause button for timelapse animation */
      /* --- YEAR SLIDER (Top Left) --- */
      #year-slider-container {
        width: 100%;
        margin-bottom: 20px;
        text-align: left;
        padding-left: 50px;
      }
      #year-slider-container .label {
        font: 20px sans-serif;
        color: purple;
        text-align: left;
        margin-left: 50px; /* Aligns with the slider */
      }
      #year-slider-container .yearSlider {
        width: 70%;
        margin: 10px 0 10px -5px;
      }
      /* --- inserted color for button--- */
    
      #playPauseButton {
        background-color: white;
        border: 2px solid lightslategray;
        border-radius: 8px;
        color: lightslategray;
        transition: 0.2s;
      }

      #playPauseButton:hover {
        background-color: lightslategray;
        color: white;
      }


      /* --- RIGHT PANEL LAYOUT (#rec-sys) --- */
      #rec-sys {
        display: flex;
        flex-direction: row; /* Horizontal layout for separate columns */
        align-items: flex-start;
        gap: 200px; /* Clear separation between columns */
        margin-top: -100px; /* Pulled up to align with top slider (tune this value) */
        margin-left: 20px;
      }

      /* Column styles - separate distinct columns */
      #slider-column {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: 450px; /* Fixed width for slider column (adjusted for legend on right) */
      }
      /* State map container with legend on the right */
      .state-map-container {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        gap: 10px;
      }
      .state-map-legend {
        position: relative;
      }
      /* ===== CHANGE: Added ranking column styling (NEW FEATURE) ===== */
      #ranking-column {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: 300px; /* Fixed width for ranking column */
      }

      /* --- RIGHT PANEL CHILD STYLES --- */
      .rec-class .label {
        text-align: center;
        font: 20px sans-serif;
        color: purple;
        width: 300px;
      }
      #rec-sys .controls {
        width: 300px;
        margin-top: 20px;
        margin-bottom: 80px;
      }
      .rec-class .label_text {
        z-index: -1;
      }
      /* ===== CHANGE: Added inflation toggle container styling (NEW FEATURE) =====
         Original code did not have inflation adjustment. This checkbox allows
         users to view home values adjusted to 2019 USD equivalent */
      #inflation-toggle-container {
        margin-left: 10px;
        margin-top: 10px;
        font: 16px sans-serif;
        color: purple;
      }
      /* ===== CHANGE: Added ranking and best county container styling (NEW FEATURES) =====
         Original code did not have state rankings or best county recommendation.
         These containers display:
         - State Rankings: List of states sorted by home value (cheapest to most expensive)
         - Best County: The county with lowest home value for selected year */
      /* Ranking and Best County Adjustments */
      #ranking-container,
      #best-county-container {
        margin-left: 0;
        margin-top: 20px;
        width: 300px;
      }
      #ranking-container .label,
      #best-county-container .label {
        margin-left: 0;
        text-align: center;
        font: 20px sans-serif;
        color: purple;
        margin-bottom: 10px;
      }

      /* ===== CHANGE: Removed bubble chart container =====
           Original code had bubble chart container (#Bubble-container) that displayed
           top 10 regions when a county was clicked. This was removed in the update. */
      /* --- GENERIC STYLES (Retained) --- */
      /* NOTE: Bubble-container-class styles retained but not used - bubble chart removed */
      .Bubble-container-class {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .Bubble-container-class .label {
        margin-left: 120px;
        font: 20px sans-serif;
        color: purple;
      }
      h3 {
        color: coral;
      }

      h1 {
        text-align: center;
      }
      .noUi-value {
        color: black;
        padding: 2px;
      }
      .noUi-connect {
        background: coral;
      }
      .noUi-marker {
        background: black;
      }
      .noUi-marker-sub {
        background: black;
      }
      #inflationToggle {
        transform: scale(1.2);
        margin-right: 8px;
      }
      .ranking-list {
        max-height: 400px;
        overflow-y: auto;
        font: 12px sans-serif;
      }
      .ranking-item {
        display: flex;
        justify-content: space-between;
        padding: 4px 8px;
        margin: 2px 0;
        border-bottom: 1px solid #ddd;
      }
      .ranking-item:hover {
        background-color: #f0f0f0;
      }
      .ranking-rank {
        font-weight: bold;
        color: coral;
        width: 30px;
      }
      .ranking-state {
        flex: 1;
        color: #333;
      }
      .ranking-value {
        color: #666;
        font-family: monospace;
      }
      .best-county-info {
        padding: 10px;
        background-color: #f9f9f9;
        border: 2px solid coral;
        border-radius: 5px;
        font: 14px sans-serif;
      }
      .best-county-name {
        font-weight: bold;
        font-size: 16px;
        color: coral;
        margin-bottom: 5px;
      }
      .best-county-details {
        color: #333;
        margin: 5px 0;
      }
      .best-county-value {
        color: #008cba;
        font-weight: bold;
        font-size: 18px;
        margin-top: 10px;
      }
    </style>

    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://d3js.org/topojson.v2.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/14.0.2/nouislider.min.js"></script>
  </head>

  <body>
    <!-- ===== CHANGE: Changed page title =====
         Original: Had "Info" section with name and class title, plus multiple headings
         Updated: Simplified to single main heading -->
    <h1>Zillow Home Data Index Visualization</h1>

    <!-- ===== CHANGE: Removed entire "Info" section and "Overview of Data" section =====
         Original HTML had:
         - <div id="info"> with name and class title
         - <div class="project"> with description
         - <div class="data"> with data description
         - <h1>Overview of Data</h1> with line graph (#line-graph)
         All removed in updated version -->
    <div id="linked-advanced" class="link-adv-class">
      <!-- ===== CHANGE: Added map-and-controls container =====
           Original: Direct children of #linked-advanced were map-container, rec-sys, Bubble-container
           Updated: Wrapped in #map-and-controls for better organization -->
      <div id="map-and-controls">
        <!-- ===== CHANGE: Added year slider container (NEW FEATURE) =====
             Original code did not have year slider. This enables users to select
             any year between 1996-2019 and includes auto-timelapse animation -->
        <div id="year-slider-container">
          <div class="label" style="display: flex; align-items: center; gap: 10px;">
            View Home Data by Year Between 1996-2019
            <button
              id="playPauseButton"
              style="padding: 5px 15px; font-size: 14px; white-space: nowrap; cursor: pointer;"
              title="Replay/Pause"
            >
              Pause
            </button>
          </div>
          <div class="yearSlider"></div>
        </div>


        <div id="map-visualization">
          <div class="map-container">
            <div class="us-map"></div>
          </div>

          <!-- ===== CHANGE: Restructured rec-sys layout =====
               Original: Single column with Bcontainer (slider), state-map, and bubble-chart
               Updated: Split into two columns:
               - #slider-column: Contains value range slider, inflation toggle, state map, legend
               - #ranking-column: Contains state rankings and best county recommendation -->
          <div id="rec-sys" class="rec-class">
            <div id="slider-column">
              <div class="Bcontainer">
                <div class="label">
                  Home Value Ranges (In multiples of Thousands)
                </div>
                <div class="controls"></div>

                <!-- ===== CHANGE: Added inflation toggle checkbox (NEW FEATURE) =====
                     Original code did not have inflation adjustment -->
                <div id="inflation-toggle-container">
                  <label>
                    <input type="checkbox" id="inflationToggle" />
                    Adjust for Inflation (2019 USD)
                  </label>
                </div>
              </div>
              <!-- ===== CHANGE: Added state-map-container and state-map-legend =====
                   Original: state-map was direct child of rec-sys
                   Updated: Wrapped in state-map-container with legend on the right -->
              <div class="state-map-container">
                <div class="state-map"></div>
                <div class="state-map-legend"></div>
              </div>
            </div>

            <!-- ===== CHANGE: Added ranking column (NEW FEATURE) =====
                 Original code did not have state rankings or best county recommendation.
                 This column displays:
                 - State Rankings: States sorted by home value for selected year
                 - Best County: County with lowest home value for selected year -->
            <div id="ranking-column">
              <div id="ranking-container" class="ranking-container">
                <div class="label">State Rankings</div>
                <div id="ranking-list" class="ranking-list"></div>
              </div>

              <div id="best-county-container" class="best-county-container">
                <div class="label">Best County to Purchase</div>
                <div id="best-county-info" class="best-county-info"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="text/javascript" src="project.js"></script>
  </body>
</html>
